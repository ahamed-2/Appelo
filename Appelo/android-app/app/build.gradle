android {

    namespace "com.appelo"

    compileSdk 35


    defaultConfig {

        applicationId "com.appelo"

        minSdk 26

        targetSdk 35

        versionCode 1

        versionName "1.0"

    }


    buildTypes {

        debug {

            minifyEnabled false

        }


        release {

            minifyEnabled false

        }

    }


    buildFeatures {

        compose true

    }


    composeOptions {

        kotlinCompilerExtensionVersion "1.5.14"

    }


    kotlinOptions {

        jvmTarget = "17"

    }

}
