name: Build Appelo APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-latest


    steps:

      # Get source code
      - name: Checkout repository
        uses: actions/checkout@v4



      # Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4

        with:
          java-version: '17'
          distribution: 'temurin'



      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4



      # Build Debug APK
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug



      # Upload APK
      - name: Upload Appelo APK
        uses: actions/upload-artifact@v4

        with:

          name: Appelo-debug-apk

          path: |
            app/build/outputs/apk/debug/*.apk
