name: Build Appelo APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Build APK
        run: |
          cd Appelo/android-app
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Upload Appelo APK
        uses: actions/upload-artifact@v4

        with:
          name: Appelo-debug-apk

          path: Appelo/android-app/app/build/outputs/apk/debug/*.apk
