name: Build Appelo APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:

          java-version: '17'

          distribution: 'temurin'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Build APK
        run: |

          cd Appelo/android-app

          gradle clean

          gradle :app:assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: Appelo-debug-apk

          path:

            Appelo/android-app/app/build/outputs/apk/debug/*.apk
